name: release

# Build and publish release assets when a v* tag is pushed:
#   - Windows portable  (PyInstaller single-file exe)
#   - Windows installer (NSIS setup, cyberpunk-styled)
#   - Linux AppImage    (PyInstaller + linuxdeploy)
#   - macOS DMG         (PyInstaller .app + create-dmg, cyberpunk background)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install .

      - name: Branding assets
        shell: pwsh
        # Must run before the exe build so the spec can embed installer/assets/installer.ico
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          python installer/make_assets.py --version $v

      - name: Build single-file exe
        shell: pwsh
        run: pyinstaller --noconfirm PS5-Image-Forge.spec

      - name: Self-test the exe
        shell: pwsh
        # The exe is a GUI-subsystem app, so it does not block the shell;
        # Start-Process -Wait is required to capture its exit code.
        run: |
          $p = Start-Process -FilePath dist\PS5-Image-Forge.exe -ArgumentList '--selftest' `
                 -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Windows portable
        shell: pwsh
        run: |
          Copy-Item dist\PS5-Image-Forge.exe `
            "dist\PS5-Image-Forge-${{ steps.ver.outputs.version }}-win64-portable.exe"

      - name: Windows installer
        shell: pwsh
        # NSIS is preinstalled on windows-latest; build_installer.ps1 finds
        # makensis on PATH or in Program Files. Install only if it's missing.
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
          powershell -ExecutionPolicy Bypass -File installer\build_installer.ps1

      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: |
            dist/PS5-Image-Forge-${{ steps.ver.outputs.version }}-win64-portable.exe
            dist/PS5-Image-Forge-Setup-*.exe
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux
  linux:
    runs-on: ubuntu-24.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v5

      # webkit2gtk + PyGObject (system python3-gi must be importable by the venv)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv python3-dev python3-gi python3-gi-cairo gobject-introspection \
            libgirepository-1.0-1 gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libgtk-3-0 libwebkit2gtk-4.1-0 \
            libfuse2 desktop-file-utils

      - name: Python environment
        run: |
          python3 -m venv --system-site-packages build-venv
          . build-venv/bin/activate
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install .

      - name: Build (PyInstaller onedir)
        run: |
          . build-venv/bin/activate
          pyinstaller --noconfirm --name PS5-Image-Forge --windowed \
            --collect-submodules mkpfs --collect-all webview --collect-all gi \
            --add-data "src/ps5_image_forge/webui:ps5_image_forge/webui" \
            --add-data "src/ps5_image_forge/payload_catalog.json:ps5_image_forge" \
            --add-data "vendor/payloads:ps5_image_forge/bundled_payloads" \
            --add-data "vendor/ufs2tool:ufs2tool" \
            entry.py

      - name: Self-test the build
        run: ./dist/PS5-Image-Forge/PS5-Image-Forge --selftest

      - name: Version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Branding icon
        run: |
          . build-venv/bin/activate
          python installer/make_assets.py --version "${{ steps.ver.outputs.version }}"
          cp installer/assets/icon.png ps5-image-forge.png

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp -a dist/PS5-Image-Forge/. AppDir/usr/bin/

      - name: Fetch linuxdeploy
        run: |
          base=https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous
          gtk=https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          curl -fsSL -o linuxdeploy.AppImage       "$base/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o linuxdeploy-plugin-gtk.sh  "$gtk"
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-gtk.sh

      - name: Build AppImage
        env:
          # PyInstaller bundles aren't plain dynamic ELFs, so the gtk plugin
          # can't auto-detect the toolkit; pin it (pywebview uses GTK3/webkit2).
          DEPLOY_GTK_VERSION: '3'
        run: |
          export PATH="$PWD:$PATH"   # let linuxdeploy find the gtk plugin in CWD
          export VERSION="${{ steps.ver.outputs.version }}"
          export OUTPUT="PS5-Image-Forge-${VERSION}-x86_64.AppImage"
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/PS5-Image-Forge \
            --desktop-file installer/linux/ps5-image-forge.desktop \
            --icon-file ps5-image-forge.png \
            --plugin gtk \
            --output appimage
          mkdir -p out
          if [ -f "$OUTPUT" ]; then
            mv "$OUTPUT" out/
          else
            # linuxdeploy auto-named it; grab the app's AppImage (not the tools')
            mv PS5-Image-Forge*-x86_64.AppImage out/ 2>/dev/null \
              || mv PS5_Image_Forge*-x86_64.AppImage "out/$OUTPUT"
          fi
          ls -la out/

      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: out/PS5-Image-Forge-*-x86_64.AppImage
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          # pywebview's macOS backend needs the pyobjc Cocoa/WebKit frameworks
          pip install pyobjc-framework-Cocoa pyobjc-framework-WebKit
          pip install .

      - name: Version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Branding assets
        run: python installer/make_assets.py --version "${{ steps.ver.outputs.version }}"

      - name: Build (.app bundle)
        run: |
          pyinstaller --noconfirm --windowed --name "PS5 Image Forge" \
            --icon installer/assets/icon.icns \
            --collect-submodules mkpfs --collect-all webview \
            --add-data "src/ps5_image_forge/webui:ps5_image_forge/webui" \
            --add-data "src/ps5_image_forge/payload_catalog.json:ps5_image_forge" \
            --add-data "vendor/payloads:ps5_image_forge/bundled_payloads" \
            --add-data "vendor/ufs2tool:ufs2tool" \
            entry.py

      - name: Self-test the build
        run: |
          "dist/PS5 Image Forge.app/Contents/MacOS/PS5 Image Forge" --selftest

      - name: Create DMG
        uses: L-Super/create-dmg-actions@v1.1.0
        with:
          dmg_name: PS5-Image-Forge-${{ steps.ver.outputs.version }}-macos-arm64
          src_dir: dist/PS5 Image Forge.app
          background: installer/assets/dmg_background.png
          window_size: 660x400

      - name: Stage macOS assets
        run: |
          mkdir -p out
          mv PS5-Image-Forge-*-macos-arm64.dmg out/ 2>/dev/null || mv *.dmg out/
          cp installer/macos/HOW-TO-OPEN.txt out/HOW-TO-OPEN-macOS.txt
          ls -la out/

      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: |
            out/*.dmg
            out/HOW-TO-OPEN-macOS.txt
          if-no-files-found: error

  # ---------------------------------------------------------------- Publish
  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: assets/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## PS5 Image Forge ${{ github.ref_name }}

            | Asset | Platform |
            |---|---|
            | `PS5-Image-Forge-*-win64-portable.exe` | Windows — portable single-file exe, no install |
            | `PS5-Image-Forge-Setup-*.exe` | Windows — installer |
            | `PS5-Image-Forge-*-x86_64.AppImage` | Linux — AppImage (x86_64) |
            | `PS5-Image-Forge-*-macos-arm64.dmg` | macOS — DMG (Apple Silicon) |

            **macOS note:** the app is unsigned, so Gatekeeper blocks the first
            launch — see `HOW-TO-OPEN-macOS.txt` (also included in the DMG's
            instructions) to open it.

            **Linux note:** the AppImage bundles the app and the GTK runtime but,
            like most pywebview apps, relies on the host's `libwebkit2gtk-4.1`
            (present on most desktops, or `apt install libwebkit2gtk-4.1-0`). The
            `.ffpkg` (UFS) backend additionally needs the .NET 8 runtime.
