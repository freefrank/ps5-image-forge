name: ci

# Runs on every push and PR. release.yml only fires on tags, so before this
# existed nothing checked master at all — two shipped bugs (a version that
# disagreed with its own tag, and a PowerShell file that only failed to parse
# on a CP1252 host) would both have been caught here.

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']      # release.yml covers tags
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        # Floor and current: pyproject allows >=3.11, and the releases build on 3.13.
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Tests
        run: python -m pytest tests/ -q

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Version sites agree
        # The release stamps from the tag, so drift here is not fatal to a
        # build — but it means the repo misreports its own last release.
        run: python tools/set_version.py --check

      - name: Translation tables
        run: python tools/check_i18n.py

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse every .ps1 under Windows PowerShell 5.1
        shell: pwsh
        # 5.1 reads a BOM-less file as the host's ANSI codepage. On a CP1252
        # runner an em dash inside a string decodes to a curly quote, which
        # PowerShell honours as a delimiter — the string closes early and the
        # parse dies far away. A CJK dev box decodes it harmlessly, so this
        # class of break is invisible until CI. Parse with the same 5.1 the
        # release job uses, not with pwsh 7.
        run: |
          # git ls-files, not a directory walk: only what the repo actually
          # ships, and immune to whatever venvs or scratch dirs are lying about.
          $failed = @()
          foreach ($rel in (git ls-files '*.ps1')) {
            $f = (Resolve-Path $rel).Path
            $out = powershell.exe -NoProfile -Command "
              `$e = `$null
              [void][System.Management.Automation.Language.Parser]::ParseFile('$f', [ref]`$null, [ref]`$e)
              if (`$e) { `$e | ForEach-Object { `$_.Message } }
            "
            if ($out) { $failed += "${rel}: $out" } else { Write-Host "ok  $rel" }
          }
          if (-not $failed) { Write-Host "all .ps1 parse clean under 5.1"; exit 0 }
          $failed | ForEach-Object { Write-Host "FAIL $_" }
          throw "PowerShell parse errors"
