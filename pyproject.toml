[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ps5-image-forge"
version = "0.7.0"
description = "Mount-free exFAT / PFS image builder for PS5 game dumps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "freefrank" }]
dependencies = [
    "mkpfs==0.0.9",
    "pywebview>=5",
]

[project.scripts]
ps5-image-forge = "ps5_image_forge.cli:main"
ps5-image-forge-gui = "ps5_image_forge.gui:main"
ps5-image-forge-app = "ps5_image_forge.app:main"

[tool.setuptools.packages.find]
where = ["src"]
